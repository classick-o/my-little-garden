name: Migratii Supabase

# Aplica migratiile din supabase/migrations pe proiectul de productie.
# Un singur mediu, deci orice ajunge in main ajunge si in baza de date reala.
#
# Secretele necesare (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN   supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF    Project Settings -> General
#   SUPABASE_DB_PASSWORD    parola bazei de date, aleasa la crearea proiectului

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/migrations.yml"
  # Permite si rulare manuala, din tab-ul Actions.
  workflow_dispatch:

concurrency:
  # Migratiile nu ruleaza niciodata in paralel, si nici nu se anuleaza la
  # jumatate: o rulare intrerupta ar lasa baza de date intr-o stare neclara.
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Aplica migratiile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Leaga proiectul
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Arata ce urmeaza sa se aplice
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase migration list --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Aplica
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --password "${{ secrets.SUPABASE_DB_PASSWORD }}"
